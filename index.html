<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c62828">
<title>Fichas médicas · Mendoza 2026</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1c1e;--mut:#62656b;--line:#e3e1dc;--r:#c62828;--acc:#1f4fa3}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121315;--card:#1c1d20;--ink:#ecebe8;--mut:#a3a5ab;--line:#2d2f33;--r:#ef5350;--acc:#8ab4ff}}
:root[data-theme=dark]{--bg:#121315;--card:#1c1d20;--ink:#ecebe8;--mut:#a3a5ab;--line:#2d2f33;--r:#ef5350;--acc:#8ab4ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.ic{width:56px;height:56px;border-radius:14px;background:var(--r);position:relative;margin-bottom:14px}
.ic:before,.ic:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.ic:before{width:16px;height:36px}.ic:after{width:36px;height:16px}
h1{font-size:21px;margin:0 0 4px}p{margin:0 0 18px;color:var(--mut);font-size:14.5px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14.5px;color:var(--mut)}
button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--r);font-weight:600;min-height:22px;margin:10px 0 0;font-size:14.5px}
small{display:block;margin-top:16px;color:var(--mut);font-size:12.5px}
</style></head><body>
<form id="f" autocomplete="off">
<div class="ic" aria-hidden="true"></div>
<h1>Fichas médicas</h1><p>Colegio San Ignacio · Mendoza 2026<br>Contenido protegido: ingresá la contraseña.</p>
<input id="pw" type="password" placeholder="Contraseña" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label><input id="rem" type="checkbox" checked> Recordar en este teléfono</label>
<button id="go" type="submit">Abrir</button>
<div class="err" id="err" role="alert"></div>
<small>Después de abrirla una vez, funciona sin internet. Para usarla como app: Compartir → “Agregar a inicio”.</small>
</form>
<script>
(function(){
var ITER=600000,$=function(i){return document.getElementById(i)};
try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t))}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
var binP=fetch('fichas.bin').then(function(r){if(!r.ok)throw new Error('net');return r.arrayBuffer()});
function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function open(key,buf){
  var u=new Uint8Array(buf);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},key,u.slice(28)).then(function(plain){
    var s=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(s).text();
  }).then(function(html){document.open();document.write(html);document.close()});
}
function derive(pw,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])});
}
function fail(m){$('err').textContent=m;$('go').disabled=false;$('go').textContent='Abrir'}
var saved=null;try{saved=localStorage.getItem('fm-key')}catch(e){}
if(saved){
  $('go').disabled=true;$('go').textContent='Abriendo…';
  binP.then(function(buf){return crypto.subtle.importKey('raw',unb64(saved),'AES-GCM',false,['decrypt']).then(function(k){return open(k,buf)})})
    .catch(function(){try{localStorage.removeItem('fm-key')}catch(e){};fail('')});
}
$('f').onsubmit=function(e){
  e.preventDefault();var pw=$('pw').value.trim().toLowerCase(),remember=$('rem').checked;if(!pw)return;
  $('err').textContent='';$('go').disabled=true;$('go').textContent='Abriendo…';
  binP.then(function(buf){
    return derive(pw,new Uint8Array(buf).slice(0,16)).then(function(k){
      return open(k,buf).then(function(){
        if(remember)return crypto.subtle.exportKey('raw',k).then(function(raw){try{localStorage.setItem('fm-key',b64(raw))}catch(e){}});
      },function(){throw new Error('pw')});
    });
  }).catch(function(err){fail(err&&err.message==='pw'?'Contraseña incorrecta.':'No se pudo cargar. Conectate a internet la primera vez.')});
};
})();
</script></body></html>
