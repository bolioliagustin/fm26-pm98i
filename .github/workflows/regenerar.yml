# Regenera la app cada vez que se guardan correcciones desde el panel (o cambia la fuente).
name: Regenerar app

on:
  push:
    branches: [main]
    paths: [correcciones.bin, fuente.bin, ci/**, .github/workflows/regenerar.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: regenerar
  cancel-in-progress: true

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerar
        run: node ci/build.mjs
        env:
          FICHAS_PASS: ${{ secrets.FICHAS_PASS }}
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Regenerar app con correcciones"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || true
